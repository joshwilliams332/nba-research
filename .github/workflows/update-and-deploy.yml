name: Update data and deploy

on:
  schedule:
    # Times are UTC (ET is UTC-4 until early November, UTC-5 after); GitHub often starts scheduled runs late.
    # Morning props are pulled once per day, on the first run after 10:00 ET. Closing (pre-tip) points lines
    # are pulled for each game on the first run within 100 minutes of its tip, so the extra evening runs are
    # spaced 30 minutes apart to catch every tip time in both EDT and EST; runs with nothing due cost no credits.
    - cron: "37 15 * * *"   # 11:37 AM EDT / 10:37 AM EST: lines, injuries and the day's props
    - cron: "37 21 * * *"   # 5:37 PM EDT / 4:37 PM EST: injury updates and line moves
    - cron: "17 22 * * *"   # 6:17 PM EDT / 5:17 PM EST: closing lines for 7:00-7:30 PM ET tips (EDT)
    - cron: "47 22 * * *"   # 6:47 PM EDT / 5:47 PM EST
    - cron: "22 23 * * *"   # 7:22 PM EDT / 6:22 PM EST: closing lines for 7:00-8:00 PM ET tips (EST)
    - cron: "52 23 * * *"   # 7:52 PM EDT / 6:52 PM EST: final injury news, 8:00-8:30 PM tips
    - cron: "17 1 * * *"    # 9:17 PM EDT / 8:17 PM EST: closing lines for 10:00-10:30 PM ET tips
    - cron: "47 1 * * *"    # 9:47 PM EDT / 8:47 PM EST
    - cron: "17 2 * * *"    # 10:17 PM EDT / 9:17 PM EST: late tips (EST)
    - cron: "47 4 * * *"    # 12:47 AM EDT: finals and box scores from the early games
    - cron: "47 7 * * *"    # 3:47 AM EDT: the late West Coast games
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # push the data store to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Box scores, finished days and past prop lines live on the `data` branch, so each run only
      # downloads what's new and prop line history survives between runs.
      - name: Check out the data store
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null; then
            git clone --quiet --depth 1 --branch data "$REMOTE" store
          else
            git init --quiet -b data store && git -C store remote add origin "$REMOTE"
          fi
      - name: Download NBA data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/build_data.py --store store
      # Errors (no games, no logs) fail the run before deploying; warnings go to the run's summary page.
      - name: Check the data
        run: python3 scripts/check_data.py
      # Replays past games through the projection model and writes site/data/model.json for model.html.
      - name: Backtest the projection model
        run: node scripts/backtest.js
      - name: Save the data store
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No store changes"; exit 0; fi
          git commit --quiet -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin data
      # Browsers keep style.css and common.js cached for a while, so after a deploy a page could load
      # the new HTML with the old script. Tagging the links (every assets/*.js and style.css) with this commit makes every deploy fetch fresh copies.
      - name: Tag asset links with this commit
        run: sed -i -E "s#assets/([a-z]+\.js|style\.css)\"#assets/\1?v=${GITHUB_SHA::8}\"#g" site/*.html
      # The service worker precaches those same ?v= URLs and names its cache after the commit, so each deploy
      # installs fresh caches and drops the old ones.
      - name: Stamp the service worker with this commit
        run: sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::8}';/" site/sw.js
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
