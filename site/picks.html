<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoop Lab · My picks</title>
<meta name="description" content="Props you saved, graded automatically from box scores: record, units, ROI and closing line value.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoop Lab">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="pagehead"><h1>My picks</h1><p>Saved on this device and graded from the box scores. For tracking only.</p></section>
  <div id="picks"></div>
</main>
<footer id="foot"></footer>
<script src="assets/common.js"></script>
<script src="assets/picks.js"></script>
<script src="assets/live.js"></script>
<script>
shell('picks');
document.getElementById('picks').innerHTML = skeleton(3, 3);

lab(['players', 'logs', 'props', 'proplines']).then(L => {
  footer(L);
  const root = document.getElementById('picks');
  const RANGES = [['all', 'All'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['season', 'This season'], ['custom', 'Dates']];
  const st = { range: store('picksRange') || 'all', from: '', to: '', manage: false, msg: '', building: false, sel: new Set(), boost: 0, price: '', units: 1 };
  let model = null;  // today's locked model picks (data/digest.json), when the data job has written them
  const modelReady = load('digest').then(([d]) => d).catch(() => null);

  const isParlay = p => p.type === 'parlay';
  // Grade one pick, with live box scores for games on now (each leg of a parlay too).
  const grade = p => isParlay(p)
    ? gradeParlay(L, p, leg => liveGradePick(L, leg, gradeResult(L, leg)))
    : liveGradePick(L, p, gradePick(L, p));

  // A pick's date is its game's (ET) date; falls back to the day it was saved.
  const pickDate = (p, g) => (g && g.d) || String(p.savedAt || '').slice(0, 10);

  function inRange(p, g) {
    const d = pickDate(p, g), today = L.meta.today;
    if (st.range === '7') return dayDiff(d, today) < 7;
    if (st.range === '30') return dayDiff(d, today) < 30;
    if (st.range === 'season') return g ? g.s === L.meta.season : true;
    if (st.range === 'custom') return (!st.from || d >= st.from) && (!st.to || d <= st.to);
    return true;
  }

  function who(p) {
    if (p.pid) {
      const pl = L.players[p.pid] || {};
      return { name: pl.n || p.name || 'Player', team: pl.t || '', img: headshot(p.pid, 40), href: `player.html?id=${p.pid}&stat=${p.stat}&line=${p.line}${p.side === 'u' ? '&side=u' : ''}` };
    }
    return { name: (L.teams[p.team] || {}).name || p.team, team: p.team, img: logo(L, p.team, 40), href: `game.html?id=${p.gid}` };
  }

  function statusChip(grade) {
    const s = grade.status;
    if (s === 'open') return `<span class="pstatus open">${grade.g ? esc(fmtTime(grade.g.t)) : 'Open'}</span>`;
    if (s === 'live') return `<span class="pstatus live">${esc(grade.g.detail || 'Live')}</span>${grade.now != null ? `<span class="pnow">Now <b>${fmt1(grade.now)}</b></span>` : ''}`;
    const label = { win: 'Won', loss: 'Lost', push: 'Push', void: 'Void' }[s];
    return `<span class="pstatus ${s}"${grade.why ? ` title="${esc(grade.why)}"` : ''}>${label}</span>`;
  }

  const units = n => `${n > 0 ? '+' : ''}${(Math.round(n * 100) / 100).toFixed(2)}u`;
  const clvText = c => c == null ? '' : `CLV ${c > 0 ? '+' : ''}${fmt1(c)}`;

  const LEG_MARK = { win: '✓', loss: '✗', push: '–', void: '–', live: '●', open: '○' };

  function parlayCard({ pick, grade }) {
    const boosted = boostedPrice(pick.price, pick.boost);
    const price = pick.price != null ? `${odds(pick.price)}${pick.boost ? ` · <b>${odds(boosted)}</b> with a ${pick.boost}% boost` : ''}${pick.book ? ` ${esc(bookName(pick.book))}` : ''}` : '';
    const legs = pick.legs.map((leg, i) => {
      const lg = grade.legs[i] || {}, w = who(leg), g = lg.g;
      const now = lg.status === 'live' && lg.now != null ? ` · now <b>${fmt1(lg.now)}</b>` : '';
      const actual = ['win', 'loss', 'push'].includes(lg.status) && lg.actual != null ? ` · ${fmt1(lg.actual)}` : lg.status === 'void' ? ` · void (${esc(lg.why || 'no result')})` : '';
      return `<a class="pleg ${lg.status || 'open'}" href="${w.href}"><i aria-hidden="true">${LEG_MARK[lg.status] || '○'}</i>
        <span class="grow"><b>${esc(w.name)}</b> ${esc(pickText(leg))}${leg.price != null ? ` <small>${odds(leg.price)}</small>` : ''}
        <small class="pleggame">${g ? `${esc(g.a)} @ ${esc(g.h)}${lg.status === 'open' ? ` · ${esc(fmtTime(g.t))}` : ''}` : ''}${now}${actual}</small></span></a>`;
    }).join('');
    const decided = ['win', 'loss', 'push', 'void'].includes(grade.status);
    const result = decided
      ? `<span class="pres"><b class="${grade.profit > 0 ? 'up' : grade.profit < 0 ? 'down' : ''}">${units(grade.profit)}</b>${grade.reduced ? ` · a leg dropped out, paid at ${odds(grade.price)}` : ''}</span>`
      : `<label class="punits">Units <select data-units="${esc(pick.id)}">${[0.5, 1, 2, 3, 4, 5].map(u => `<option value="${u}"${(pick.units || 1) === u ? ' selected' : ''}>${u}</option>`).join('')}</select></label>`;
    return `<div class="pickcard parlay ${grade.status}">
      <div class="row phead"><div class="grow"><div class="name">${esc(pickText(pick))}</div><div class="sub">${price}</div></div>${statusChip(grade)}</div>
      <div class="plegs">${legs}</div>
      <div class="pfoot">${result}<span class="grow"></span>
        <button class="iconbtn" data-share="${esc(pick.id)}" aria-label="Share this parlay" title="Share">${ICON_SHARE}</button>
        <button class="iconbtn" data-remove="${esc(pick.id)}" aria-label="Remove this parlay" title="Remove">×</button></div>
    </div>`;
  }

  function pickCard(r) {
    if (isParlay(r.pick)) return parlayCard(r);
    const { pick, grade } = r;
    const w = who(pick), g = grade.g;
    const pickable = st.building && grade.status === 'open';
    const game = g ? `${g.a} @ ${g.h} · ${fmtDay(g.d, { month: 'short', day: 'numeric' })}` : 'Game not found';
    const price = pick.price != null ? `${odds(pick.price)}${pick.book ? ` ${bookName(pick.book)}` : ''}` : 'no price (−110 assumed)';
    const decided = ['win', 'loss', 'push', 'void'].includes(grade.status);
    const result = decided
      ? `<span class="pres">${grade.actual != null ? `Actual <b>${fmt1(grade.actual)}</b> · ` : ''}<b class="${grade.profit > 0 ? 'up' : grade.profit < 0 ? 'down' : ''}">${units(grade.profit)}</b>${grade.why ? ` · ${esc(grade.why)}` : ''}</span>`
      : `<label class="punits">Units <select data-units="${esc(pick.id)}">${[0.5, 1, 2, 3, 5].map(u => `<option value="${u}"${(pick.units || 1) === u ? ' selected' : ''}>${u}</option>`).join('')}</select></label>`;
    const clv = grade.clv != null ? `<span class="pclv ${grade.clv > 0 ? 'up' : grade.clv < 0 ? 'down' : ''}" title="Closing line ${grade.close}: ${grade.clv > 0 ? 'the line moved your way after you saved it' : grade.clv < 0 ? 'the line moved against you' : 'no move'}">${clvText(grade.clv)}</span>` : '';
    return `<div class="pickcard ${grade.status}${pickable && st.sel.has(pick.id) ? ' sel' : ''}">
      ${pickable ? `<label class="pselect"><input type="checkbox" data-sel="${esc(pick.id)}"${st.sel.has(pick.id) ? ' checked' : ''}> Add to parlay</label>` : ''}
      <a class="row" href="${w.href}">${w.img}
        <div class="grow"><div class="name">${esc(w.name)} ${w.team ? `<small>(${esc(w.team)})</small>` : ''}</div>
          <div class="sub"><b>${esc(pickText(pick))}</b> · ${esc(price)}</div>
          <div class="sub">${esc(game)}</div></div>
        ${statusChip(grade)}</a>
      <div class="pfoot">${result}${clv}<span class="grow"></span>
        <button class="iconbtn" data-share="${esc(pick.id)}" aria-label="Share this pick" title="Share">${ICON_SHARE}</button>
        <button class="iconbtn" data-remove="${esc(pick.id)}" aria-label="Remove this pick" title="Remove">×</button></div>
    </div>`;
  }

  const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';

  function breakdown(rows, keyFn, labelFn) {
    const groups = new Map();
    for (const r of rows) {
      const k = keyFn(r.pick);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    return [...groups.entries()].map(([k, list]) => ({ label: labelFn(k), s: summarize(list) }))
      .filter(x => x.s.w + x.s.l + x.s.p)
      .sort((a, b) => (b.s.w + b.s.l) - (a.s.w + a.s.l));
  }

  function breakdownTable(title, groups) {
    if (!groups.length) return '';
    return `<div class="card"><h3>${title}</h3><div class="tablewrap"><table class="data"><tr><th class="l"></th><th>Record</th><th>Units</th><th>ROI</th></tr>
      ${groups.map(x => `<tr><td class="l">${esc(x.label)}</td><td>${x.s.w}-${x.s.l}${x.s.p ? `-${x.s.p}` : ''}</td>
        <td class="${x.s.profit > 0 ? 'hit' : x.s.profit < 0 ? 'miss' : ''}">${units(x.s.profit)}</td><td>${x.s.roi == null ? '-' : pct(x.s.roi)}</td></tr>`).join('')}
      </table></div></div>`;
  }

  function manageCard() {
    if (!st.manage) return `<p class="note" style="text-align:center"><button class="btn" data-manage="1">Move picks to another device</button></p>`;
    return `<div class="card" id="manage"><h3>Move picks between devices</h3>
      <p class="note" style="margin-top:0">Picks live in this browser only. Export them here and import on your other phone or computer.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px;margin:10px 0">
        <button class="btn" data-export="file">Download file</button><button class="btn" data-export="code">Copy code</button>
        <label class="btn" style="cursor:pointer">Import file<input type="file" accept="application/json,.json,.txt" data-importfile="1" hidden></label></div>
      <textarea id="importcode" rows="3" placeholder="Paste an export code here…" class="pastebox"></textarea>
      <div class="row" style="gap:8px;margin-top:8px"><button class="btn" data-import="1">Import code</button><span class="grow"></span>
        <button class="btn danger" data-clearall="1">Delete all picks</button></div>
      ${st.msg ? `<p class="note">${esc(st.msg)}</p>` : ''}</div>`;
  }

  // The model's picks: a card with its record (since the record started), today's picks to add in a tap, and every
  // past day graded under "See all picks". Open / closed state of the card and of each day is remembered.
  const opened = Object.assign({ model: true, history: false }, store('picksOpen') || {});
  const isOpen = (k, dflt) => (k in opened ? opened[k] : dflt);
  const statusMark = s => ({ win: '✓', loss: '✗', push: '–', void: '–', live: '●', open: '○' }[s] || '○');
  const recordLine = s => `${s.w}-${s.l}${s.p ? `-${s.p}` : ''} · <b class="${s.profit > 0 ? 'up' : s.profit < 0 ? 'down' : ''}">${units(s.profit)}</b>`;

  function modelRow(p, g, keys, canAdd) {
    const pl = L.players[p.pid] || {}, st_ = g.status;
    const on = keys.has(pickKey({ ...p, line: +p.line }));
    const res = ['win', 'loss', 'push'].includes(st_) ? ` · ${fmt1(g.actual)}` : st_ === 'live' && g.now != null ? ` · now ${fmt1(g.now)}` : st_ === 'void' ? ' · void' : '';
    const right = canAdd && st_ === 'open'
      ? `<button class="btn${on ? ' on' : ''}" data-addmodel="${esc(p.id)}"${on ? ' disabled' : ''}>${on ? 'Added' : '+ Add'}</button>`
      : `<span class="pstatus ${st_}">${st_ === 'open' ? esc(fmtTime(g.g.t)) : st_ === 'live' ? 'Live' : { win: 'Won', loss: 'Lost', push: 'Push', void: 'Void' }[st_]}</span>`;
    return `<div class="row mpick ${st_}"><i class="mmark" aria-hidden="true">${statusMark(st_)}</i>
      <a class="grow" href="player.html?id=${esc(p.pid)}&stat=${esc(p.stat)}&line=${p.line}${p.side === 'u' ? '&side=u' : ''}"><b>${esc(pl.n || p.name)}</b>
        <small>${esc(pickText(p))} · ${odds(p.price)}${res}</small>
        ${canAdd && p.why && st_ === 'open' ? `<small class="pleggame">${esc(p.why)}</small>` : ''}</a>${right}</div>`;
  }

  function modelCard() {
    if (!model || !(model.history || []).length) return '';
    const keys = savedKeys();
    const days = model.history.map(d => {
      const rows = d.picks.map(p => ({ pick: { ...p, units: 1 }, grade: liveGradePick(L, p, gradePick(L, { ...p, units: 1 })) }));
      return { date: d.date, rows, s: summarize(rows) };
    });
    const season = summarize(days.flatMap(d => d.rows));
    const today = days.find(d => d.date === L.meta.today);
    const past = days.filter(d => d !== today);
    const addable = today ? today.rows.filter(r => r.grade.status === 'open' && !keys.has(pickKey({ ...r.pick, line: +r.pick.line }))).length : 0;
    const todayHtml = today
      ? `<div class="row mhead"><h4 class="grow">Today · ${today.rows.length} pick${today.rows.length === 1 ? '' : 's'}</h4>
          ${addable ? `<button class="btn" data-addmodel="all">Add ${addable === today.rows.length ? 'all ' : ''}${addable}</button>` : ''}</div>
        ${today.rows.map(r => modelRow(r.pick, r.grade, keys, true)).join('')}
        <p class="note">Locked this morning from the props pull. Check your book's price before you bet.</p>`
      : `<p class="note">No picks today yet. They lock on the morning props run (about 10:30 AM ET).</p>`;
    const dayBlock = d => `<details class="pday" data-open="m${d.date}"${isOpen(`m${d.date}`, false) ? ' open' : ''}>
      <summary><span class="grow">${esc(fmtDay(d.date, { weekday: 'short', month: 'short', day: 'numeric' }))}</span><span class="pdayrec">${recordLine(d.s)}</span></summary>
      ${d.rows.map(r => modelRow(r.pick, r.grade, keys, false)).join('')}</details>`;
    return `<details class="card mpicks" data-open="model"${isOpen('model', true) ? ' open' : ''}>
      <summary><span class="grow"><b>Hoop Lab model picks</b><small>Record since ${esc(fmtDay(model.recordStart || days[days.length - 1].date, { month: 'short', day: 'numeric' }))} · 1 unit each</small></span>
        <span class="mrec">${recordLine(season)}${season.roi != null ? ` <small>ROI ${pct(season.roi)}</small>` : ''}</span></summary>
      ${todayHtml}
      ${past.length ? `<details class="mall" data-open="history"${isOpen('history', false) ? ' open' : ''}>
        <summary>See all picks <small>${past.length} day${past.length === 1 ? '' : 's'}</small></summary>${past.map(dayBlock).join('')}</details>` : ''}
      <p class="note"><a href="model.html">How the model works</a> · picks are never edited after they lock.</p>
    </details>`;
  }

  // The parlay builder's bar: legs picked, price (worked out, or what your book shows), boost, units.
  function builderBar(all) {
    if (!st.building) return '';
    const legs = all.filter(r => st.sel.has(r.pick.id)).map(r => r.pick);
    const est = legs.length >= 2 ? parlayPrice(legs) : null;
    const price = st.price !== '' ? +st.price : est;
    const boosted = boostedPrice(price, st.boost);
    const sameGame = new Set(legs.map(l => l.gid)).size < legs.length;
    return `<div class="parlaybar" role="region" aria-label="Parlay builder">
      <div class="row"><b>${legs.length} leg${legs.length === 1 ? '' : 's'}</b>
        <span class="grow muted">${price != null ? `${odds(price)}${st.boost ? ` → ${odds(boosted)} boosted` : ''}` : 'pick 2 or more open picks'}</span>
        <button class="btn" data-build="cancel">Cancel</button></div>
      ${sameGame ? '<p class="note warn">Two legs are from the same game. Books price those as a same-game parlay, so enter the price your book shows.</p>' : ''}
      <div class="row pbfields">
        <label class="field"><span>Price</span><input inputmode="numeric" data-pprice="1" placeholder="${est != null ? odds(est) : '+250'}" value="${esc(st.price)}"></label>
        <label class="field"><span>Profit boost</span><select data-pboost="1">${[0, 10, 20, 25, 30, 50, 100].map(b => `<option value="${b}"${st.boost === b ? ' selected' : ''}>${b ? `${b}%` : 'None'}</option>`).join('')}</select></label>
        <label class="field"><span>Units</span><select data-punits="1">${[0.5, 1, 2, 3, 4, 5].map(u => `<option value="${u}"${st.units === u ? ' selected' : ''}>${u}</option>`).join('')}</select></label>
        <button class="btn primary" data-build="save"${legs.length >= 2 ? '' : ' disabled'}>Save parlay</button></div>
    </div>`;
  }

  // Your graded picks, one drop-down per day (the latest day open), each with that day's record.
  function gradedByDay(done) {
    const days = new Map();
    for (const r of done) {
      const d = pickDate(r.pick, r.grade.g);
      if (!days.has(d)) days.set(d, []);
      days.get(d).push(r);
    }
    return [...days.entries()].map(([d, rows], i) => `<details class="pday mine" data-open="d${d}"${isOpen(`d${d}`, i === 0) ? ' open' : ''}>
      <summary><span class="grow">${esc(fmtDay(d, { weekday: 'short', month: 'short', day: 'numeric' }))} <small>${rows.length} pick${rows.length === 1 ? '' : 's'}</small></span>
        <span class="pdayrec">${recordLine(summarize(rows))}</span></summary>${rows.map(pickCard).join('')}</details>`).join('');
  }

  function render() {
    const all = loadPicks().map(pick => ({ pick, grade: grade(pick) }));
    if (!all.length) {
      root.innerHTML = modelCard() + `<div class="card empty"><b>No saved picks yet.</b><br><small>Tap the bookmark on any player prop (on a game's Player props tab, the Props page or a player page) to track it here.
        It grades itself after the game.</small></div>${manageCard()}`;
      return;
    }
    const rows = all.filter(r => inRange(r.pick, r.grade.g));
    const open = rows.filter(r => r.grade.status === 'open' || r.grade.status === 'live')
      .sort((a, b) => ((a.grade.g || {}).t || '') < ((b.grade.g || {}).t || '') ? -1 : 1);
    const done = rows.filter(r => !open.includes(r))
      .sort((a, b) => pickDate(b.pick, b.grade.g) < pickDate(a.pick, a.grade.g) ? -1 : 1);
    const s = summarize(done);
    const ranges = `<div class="tabs">${RANGES.map(([k, l]) => `<button data-range="${k}" class="${k === st.range ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${st.range === 'custom' ? `<div class="row" style="gap:8px;margin:-4px 0 12px"><label class="field grow"><span>From</span><input type="date" data-from="1" value="${st.from}"></label>
        <label class="field grow"><span>To</span><input type="date" data-to="1" value="${st.to}"></label></div>` : ''}`;
    const record = `<div class="card precord">
      <div class="pstats">
        <div><small>RECORD</small><b>${s.w}-${s.l}${s.p ? `-${s.p}` : ''}</b></div>
        <div><small>UNITS</small><b class="${s.profit > 0 ? 'up' : s.profit < 0 ? 'down' : ''}">${units(s.profit)}</b></div>
        <div><small>ROI</small><b>${s.roi == null ? '-' : pct(s.roi)}</b></div>
        <div><small>AVG CLV</small><b>${s.clv == null ? '-' : `${s.clv > 0 ? '+' : ''}${fmt1(s.clv)}`}</b></div>
      </div>
      <div class="row" style="margin-top:10px"><span class="note" style="margin:0">${done.length} graded${s.v ? ` (${s.v} void)` : ''} · ${open.length} open</span><span class="grow"></span>
        <button class="btn" data-sharerecord="1">${ICON_SHARE} Share record</button></div>
      ${s.clv == null ? '<p class="note">Closing line value appears once a pre-tip line is on record for your picks.</p>' : ''}
    </div>`;
    const openSingles = open.filter(r => !isParlay(r.pick)).length;
    root.innerHTML = modelCard() + ranges + record
      + (open.length ? `<div class="row psec"><h2 class="grow" style="margin:0">Open <small>${open.length}</small></h2>
          ${openSingles >= 2 && !st.building ? '<button class="btn" data-build="start">Build a parlay</button>' : ''}</div>
          ${st.building ? '<p class="note">Tick the picks to combine, then set the price your book shows.</p>' : ''}${open.map(pickCard).join('')}` : '')
      + (done.length ? `<h2 class="psec">Graded <small>${done.length}</small></h2>${gradedByDay(done)}` : '')
      + (!rows.length ? `<div class="card empty">No picks in this date range.</div>` : '')
      + `<div class="grid2">${breakdownTable('By market', breakdown(done, p => (isParlay(p) ? 'parlay' : p.stat), k => (k === 'parlay' ? 'Parlays' : pickMarketLabel(k))))}
        ${breakdownTable('By side', breakdown(done, p => (isParlay(p) ? 'parlay' : p.side), k => ({ o: 'Overs', u: 'Unders', h: 'Home', a: 'Away', parlay: 'Parlays' }[k] || k)))}</div>`
      + manageCard() + builderBar(all);
    document.body.classList.toggle('building', st.building);
    root._rows = all;
    root._summary = s;
  }

  function setMsg(m) { st.msg = m; st.manage = true; render(); }

  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function importText(text) {
    try {
      const { picks, skipped } = parseImport(text);
      const list = loadPicks(), added = mergePicks(list, picks);
      savePicks(list);
      setMsg(`Imported ${added} pick${added === 1 ? '' : 's'}${picks.length - added ? `, ${picks.length - added} already here` : ''}${skipped ? `, ${skipped} unreadable` : ''}.`);
    } catch (e) { setMsg(e.message); }
  }

  root.addEventListener('click', async e => {
    const t = e.target.closest('[data-range],[data-remove],[data-share],[data-sharerecord],[data-manage],[data-export],[data-import],[data-clearall],[data-build],[data-addmodel]');
    if (!t) return;
    const d = t.dataset;
    if (d.build === 'start') { Object.assign(st, { building: true, sel: new Set(), boost: 0, price: '', units: 1 }); render(); }
    else if (d.build === 'cancel') { st.building = false; render(); }
    else if (d.build === 'save') {
      const legs = loadPicks().filter(p => st.sel.has(p.id) && !isParlay(p));
      if (legs.length < 2) return;
      const price = st.price === '' ? null : parseInt(String(st.price).replace('+', ''), 10);
      const list = loadPicks();
      list.push(makeParlay({ legs, price: price != null && Math.abs(price) >= 100 ? price : null, boost: st.boost, units: st.units, book: legs[0].book }));
      savePicks(list);
      st.building = false;
      pickToast('Parlay saved');
      render();
    }
    else if (d.addmodel) {
      const keys = savedKeys();
      const add = model.picks.filter(p => (d.addmodel === 'all' || p.id === d.addmodel) && !keys.has(pickKey({ ...p, line: +p.line }))
        && (L.byId.get(p.gid) || {}).state === 'pre');
      const list = loadPicks();
      for (const p of add) list.push(makePick({ ...p, units: 1 }));
      savePicks(list);
      pickToast(`Added ${add.length} pick${add.length === 1 ? '' : 's'}`);
      render();
    }
    else if (d.range) { st.range = d.range; store('picksRange', d.range); render(); }
    else if (d.remove) { savePicks(loadPicks().filter(p => p.id !== d.remove)); render(); }
    else if (d.manage) { st.manage = true; render(); }
    else if (d.export === 'file') download(`hooplab-picks-${L.meta.today}.json`, exportPicks());
    else if (d.export === 'code') {
      const code = exportCode();
      try { await navigator.clipboard.writeText(code); setMsg('Code copied. Paste it into "Import code" on your other device.'); }
      catch (err) { document.getElementById('importcode').value = code; setMsg('Copy the code from the box above.'); }
    }
    else if (d.import) importText(document.getElementById('importcode').value);
    else if (d.clearall) { if (confirm('Delete all saved picks on this device?')) { savePicks([]); setMsg('All picks deleted.'); } }
    else if (d.share) {
      const r = root._rows.find(x => x.pick.id === d.share);
      if (!r) return;
      const w = who(r.pick), g = r.grade.g, s = r.grade.status;
      const big = { win: 'WON', loss: 'LOST', push: 'PUSH', void: 'VOID' }[s];
      if (isParlay(r.pick)) {
        const p = r.pick, shown = boostedPrice(p.price, p.boost);
        sharePNG(shareCanvas({
          kicker: g ? `Parlay · ${fmtDay(g.d, { month: 'short', day: 'numeric' })}` : 'My parlay',
          title: `${pickText(p)} ${shown != null ? `(${odds(shown)}${p.boost ? ' boosted' : ''})` : ''}`,
          subtitle: p.legs.map((leg, i) => `${LEG_MARK[(r.grade.legs[i] || {}).status] || '○'} ${who(leg).name} ${pickText(leg)}`).join(' · '),
          big, bigColor: s === 'win' ? '#2ad38b' : s === 'loss' ? '#ff5c6c' : '#8d95a3',
        }), `hooplab-parlay-${p.id}.png`);
        return;
      }
      sharePNG(shareCanvas({
        kicker: g ? `${g.a} @ ${g.h} · ${fmtDay(g.d, { month: 'short', day: 'numeric' })}` : 'My pick',
        title: w.name, subtitle: `${pickText(r.pick)}${r.pick.price != null ? ` (${odds(r.pick.price)})` : ''}`,
        big, bigColor: s === 'win' ? '#2ad38b' : s === 'loss' ? '#ff5c6c' : '#8d95a3',
        lines: r.grade.actual != null ? [`Actual: ${fmt1(r.grade.actual)}${r.grade.clv != null ? ` · ${clvText(r.grade.clv)}` : ''}`] : [],
      }), `hooplab-pick-${r.pick.id}.png`);
    }
    else if (d.sharerecord) {
      const s = root._summary, label = RANGES.find(x => x[0] === st.range)[1];
      sharePNG(shareCanvas({
        kicker: `My picks · ${label}`, title: `${s.w}-${s.l}${s.p ? `-${s.p}` : ''} record`,
        subtitle: `${s.roi == null ? '' : `ROI ${pct(s.roi)}`}${s.clv != null ? ` · avg CLV ${s.clv > 0 ? '+' : ''}${fmt1(s.clv)}` : ''}`,
        big: units(s.profit), bigColor: s.profit >= 0 ? '#2ad38b' : '#ff5c6c',
      }), 'hooplab-record.png');
    }
  });
  root.addEventListener('toggle', e => {
    const k = e.target.dataset && e.target.dataset.open;
    if (!k) return;
    opened[k] = e.target.open;
    store('picksOpen', opened);
  }, true);
  root.addEventListener('change', e => {
    const t = e.target, d = t.dataset;
    if (d.sel) { if (t.checked) st.sel.add(d.sel); else st.sel.delete(d.sel); render(); }
    else if (d.pboost) { st.boost = +t.value; render(); }
    else if (d.punits) { st.units = +t.value; render(); }
    else if (d.units) {
      const list = loadPicks(), p = list.find(x => x.id === d.units);
      if (p) { p.units = +t.value; savePicks(list); render(); }
    } else if (d.pprice) {
      st.price = t.value.trim();
      render();
    } else if (d.from || d.to) {
      st[d.from ? 'from' : 'to'] = t.value;
      render();
    } else if (d.importfile && t.files[0]) {
      t.files[0].text().then(importText);
    }
  });
  render();

  modelReady.then(m => {
    model = m;
    render();
    // Live: keep the score, clock and "Now" stat of today's picks (yours and the model's) fresh while games are on.
    const liveGids = [...new Set(loadPicks().flatMap(p => (isParlay(p) ? p.legs.map(l => l.gid) : [p.gid])).concat(model ? model.picks.map(p => p.gid) : [])
      .filter(id => { const g = L.byId.get(id); return g && g.d >= L.meta.today && g.state !== 'post'; }))].slice(0, 10);
    if (liveGids.length) startLive(L, { day: L.meta.today, gids: liveGids, onUpdate() { if (!document.activeElement.matches('input, select, textarea')) render(); } });
  });
}).catch(fail);
</script>
</body>
</html>
