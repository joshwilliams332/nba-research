<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Lab · Players</title>
<meta name="description" content="Find any NFL quarterback, running back, receiver or tight end for prop research.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mingus Lab">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/nfl.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="pagehead"><h1>NFL Players</h1><p>Quarterbacks, running backs, receivers and tight ends with a game this season.</p></section>
  <input class="search" id="q" type="search" placeholder="Search players or teams…" autocomplete="off" style="margin-bottom:12px">
  <div class="tabs" id="pos"></div>
  <div class="card flush" id="list"></div>
</main>
<footer id="foot"></footer>
<script src="assets/common.js"></script>
<script src="assets/nfl.js"></script>
<script>
shell('nfl-players', 'nfl');
load('nfl/meta', 'nfl/games', 'nfl/teams', 'nfl/teamstats', 'nfl/players', 'nfl/logs').then(([meta, games, teams, teamstats, players, logs]) => {
  const N = nflAddPlayers(nflLab(meta, games, teams, teamstats), players, logs);
  const q = document.getElementById('q');
  let pos = 'All';
  // This season's players, busiest first (attempts + carries + targets per game).
  const list = Object.entries(N.players).map(([pid, p]) => {
    const rows = nflPlayerRows(N, pid).filter(r => r.season === meta.season);
    const vol = rows.length ? rows.reduce((a, r) => a + r.att + r.car + r.tgt, 0) / rows.length : 0;
    return { pid, p, rows, vol };
  }).filter(x => x.rows.length).sort((a, b) => b.vol - a.vol);
  function render() {
    document.getElementById('pos').innerHTML = ['All', 'QB', 'RB', 'WR', 'TE'].map(k => `<button data-pos="${k}" class="${k === pos ? 'on' : ''}">${k}</button>`).join('');
    const term = q.value.trim().toLowerCase();
    const shown = list.filter(x => (pos === 'All' || nflPosGroup(x.p.pos) === pos)
      && (!term || `${x.p.n} ${x.p.t} ${(N.teams[x.p.t] || {}).nickname || ''}`.toLowerCase().includes(term))).slice(0, 80);
    const line = x => {
      const r = x.rows, avg = k => fmt1(r.reduce((a, y) => a + y[k], 0) / r.length);
      return x.p.pos === 'QB' ? `${avg('pass_yds')} pass yds · ${avg('rush_yds')} rush` : x.p.pos === 'RB' || x.p.pos === 'FB' ? `${avg('rush_yds')} rush yds · ${avg('rec')} rec` : `${avg('rec_yds')} rec yds · ${avg('tgt')} tgt`;
    };
    document.getElementById('list').innerHTML = shown.length ? shown.map(x => `<a class="row nflplayer" href="nfl-player.html?id=${encodeURIComponent(x.pid)}">
      ${x.p.img ? `<img class="nflmug" src="${esc(x.p.img)}" alt="" width="36" height="36" loading="lazy" onerror="this.remove()">` : ''}
      <div class="grow"><b>${esc(x.p.n)}</b> <small class="muted">${esc(x.p.pos)} · ${esc(x.p.t)}</small>${x.p.st ? ` <span class="tag nflst ${/^IR|Out/.test(x.p.st) ? 'out' : 'q'}">${esc(x.p.st)}</span>` : ''}
        <div class="sub">${line(x)} a game · ${x.rows.length} games</div></div><span class="gochev">›</span></a>`).join('') : emptyState('No players match.');
  }
  document.getElementById('pos').addEventListener('click', e => { const b = e.target.closest('[data-pos]'); if (b) { pos = b.dataset.pos; render(); } });
  q.addEventListener('input', render);
  render();
}).catch(err => {
  document.getElementById('list').innerHTML = emptyState('NFL data is unavailable right now.');
  console.error(err);
});
</script>
</body>
</html>
