<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoop Lab · Games</title>
<meta name="description" content="NBA games with money line, spread and total trends: last 10 and head-to-head hit rates.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoop Lab">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="pagehead"><h1>Games</h1><p id="slate">&nbsp;</p></section>
  <div class="days" id="days"></div>
  <input class="search" id="q" type="search" placeholder="Search teams…" autocomplete="off" style="margin-bottom:12px">
  <div id="list"></div>
</main>
<footer id="foot"></footer>
<script src="assets/common.js"></script>
<script src="assets/context.js"></script>
<script src="assets/live.js"></script>
<script>
shell('games');
document.getElementById('list').innerHTML = skeleton(3, 4);
lab().then(L => {
  footer(L);
  const dates = [...new Set(L.games.map(g => g.d))].sort();
  const today = L.meta.today;
  // Three days back through the next week, only days with games.
  const shown = dates.filter(d => dayDiff(today, d) >= -3 && dayDiff(today, d) <= 7);
  let day = params().get('d');
  if (!shown.includes(day)) day = shown.find(d => d >= today) || shown[shown.length - 1];
  const q = document.getElementById('q');

  function renderDays() {
    document.getElementById('days').innerHTML = shown.map(d => {
      const diff = dayDiff(today, d);
      const top = diff === 0 ? 'Today' : diff === -1 ? 'Yesterday' : diff === 1 ? 'Tomorrow' : fmtDay(d, { month: 'short', day: 'numeric' });
      return `<button data-d="${d}" class="${d === day ? 'on' : ''}"><b>${top}</b><small>${fmtDay(d, { weekday: 'short' })}</small></button>`;
    }).join('');
    const on = document.querySelector('#days .on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function card(g) {
    const A = L.teams[g.a], H = L.teams[g.h];
    const started = g.state !== 'pre', final = g.state === 'post';
    const mid = started
      ? `<b class="score">${g.as ?? ''} - ${g.hs ?? ''}</b><br>${gameStatus(g)}`
      : `<b>${gameStatus(g)}</b><br><small>${esc(g.tv || '')}</small>`;
    const lost = side => final && (side === 'a' ? g.as < g.hs : g.hs < g.as) ? ' class="lose"' : '';
    const results = final ? lineResult(g).split(' · ').filter(Boolean) : [];
    const body = final
      ? `<div class="resultline">${results.length ? results.map(r => `<span>${esc(r)}</span>`).join('') : '<span>No lines on record</span>'}</div>`
      : gameLines(L, g);
    return `<a class="card gamecard" href="game.html?id=${g.id}" style="--ca:${A.color}33;--ch:${H.color}33">
      <div class="gamehead">
        <div class="t">${logo(L, g.a, 34)}<div><b${lost('a')}>${esc(A.name)}</b><small>${esc(g.ar || '')}</small></div></div>
        <div class="mid">${mid}</div>
        <div class="t home">${logo(L, g.h, 34)}<div><b${lost('h')}>${esc(H.name)}</b><small>${esc(g.hr || '')}</small></div></div>
      </div>${final ? '' : impliedRow(L, g)}${body}</a>`;
  }

  function renderList() {
    const term = q.value.trim().toLowerCase();
    const games = L.games.filter(g => g.d === day).filter(g => !term || [g.h, g.a].some(t => {
      const T = L.teams[t];
      return `${t} ${T.city} ${T.name}`.toLowerCase().includes(term);
    }));
    document.getElementById('list').innerHTML = games.length ? games.map(card).join('')
      : emptyState(term ? 'No games match that search.' : 'No games this day.', term ? '' : 'Pick another day above.');
    renderSlate();
  }

  // "Wed, Oct 28 · 12 games · lines from DraftKings · updated 3:12 PM"
  function renderSlate() {
    const games = L.games.filter(g => g.d === day);
    const books = [...new Set(games.map(g => g.line && g.line.bk).filter(Boolean))];
    const live = games.filter(g => g.state === 'in').length;
    const built = new Date(L.meta.built).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('slate').textContent = [fmtDay(day, { weekday: 'long', month: 'short', day: 'numeric' }),
      `${games.length} game${games.length === 1 ? '' : 's'}`, live ? `${live} live` : '',
      books.length ? `lines from ${books.join(', ')}` : '', (live && liveNote(L)) || `updated ${built}`].filter(Boolean).join(' · ');
  }

  document.getElementById('days').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    day = b.dataset.d;
    history.replaceState(null, '', `?d=${day}`);
    renderDays();
    renderList();
  });
  q.addEventListener('input', renderList);
  renderDays();
  renderList();
  // Live scores for today's games, straight from ESPN while any are on (the list redraws when they change).
  startLive(L, { day: today, onUpdate() { if (day === today && document.activeElement !== q) renderList(); } });
}).catch(fail);
</script>
</body>
</html>
