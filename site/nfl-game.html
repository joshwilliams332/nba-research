<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Lab · Game</title>
<meta name="description" content="NFL game breakdown: money line, spread and total trends, and the offense vs defense matchup.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mingus Lab">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/nfl.css">
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="assets/common.js"></script>
<script src="assets/nfl.js"></script>
<script src="assets/picks.js"></script>
<script src="assets/live.js"></script>
<script>
shell('nfl-games', 'nfl');
const main = document.getElementById('main');
main.innerHTML = skeleton(3, 4);
load('nfl/meta', 'nfl/games', 'nfl/teams', 'nfl/teamstats', 'nfl/players', 'nfl/logs', 'nfl/props', 'nfl/proj')
  .then(([meta, games, teams, teamstats, players, logs, props, proj]) => {
  const N = nflAddPlayers(nflLab(meta, games, teams, teamstats), players, logs, props, proj);
  const params = new URLSearchParams(location.search);
  const g = N.byId.get(params.get('id'));
  if (!g) { main.innerHTML = emptyState('Game not found.', '<a href="nfl.html">Back to NFL games</a>'); return; }
  const A = N.teams[g.away] || {}, H = N.teams[g.home] || {};
  document.title = `NFL Lab · ${g.away} @ ${g.home}`;
  document.getElementById('foot').innerHTML = `<p>NFL data: ESPN (scores, DraftKings lines, box scores, injuries) with nflverse history; props from Mingus Picks and DraftKings. Trends describe the past, not the future. For research and fun; 21+ · Gamble responsibly · 1-800-GAMBLER.</p>`;

  // Same layout as Hoop Lab's game page: Odds (Game lines / Player props) · Insights · Matchup.
  const hash = location.hash.slice(1);
  const st = {
    // A finished game opens on its box score, like Hoop Lab.
    tab: ['insights', 'matchup', 'box'].includes(hash) ? hash : hash ? 'odds' : g.final ? 'box' : 'odds', sub: hash === 'props' ? 'props' : 'lines', open: null,
    stat: NFL_STATS[params.get('stat')] ? params.get('stat') : null, term: '', ikind: 'all', isort: 'best',
    m: ['ml', 'spread', 'over', 'under'].includes(params.get('m')) ? params.get('m') : (g.home_spread != null ? 'spread' : 'ml'),
    team: params.get('s') === 'a' ? g.away : g.home,
    win: 'l10', off: g.away,
  };
  if (st.m === 'over' || st.m === 'under') st.team = params.get('s') === 'h' ? g.home : g.away;

  const weather = [g.stadium, g.roof && g.roof !== 'outdoors' ? g.roof : (g.temp != null ? `${g.temp}°F${g.wind != null ? `, wind ${g.wind} mph` : ''}` : '')].filter(Boolean).join(' · ');
  const midHtml = () => {
    const live = nflLiveScore(g);
    if (live) return `<div class="score"><span>${live.away}</span> - <span>${live.home}</span></div><span class="status live"><i></i>${esc(live.detail)}</span>`;
    return g.final
      ? `<div class="score"><span class="${g.away_score < g.home_score ? 'lose' : ''}">${g.away_score}</span> - <span class="${g.home_score < g.away_score ? 'lose' : ''}">${g.home_score}</span></div>Final`
      : `<b style="color:var(--text);font-size:16px">${esc(nflKick(g).split(' · ')[1])}</b><br>${esc(fmtDay(g.date))}`;
  };
  main.innerHTML = `
    <section class="hero" style="--c1:${A.color || '#1d5c57'}aa;--c2:${H.color || '#7a3b17'}aa">
      <div class="row"><a class="back" href="nfl.html?w=${g.week}" aria-label="Back to NFL games">‹</a>
        <span class="grow" style="text-align:center;color:var(--muted);font-size:13px">Week ${g.week}${weather ? ` · ${esc(weather)}` : ''}</span><span style="width:38px"></span></div>
      <div class="matchup">
        <div class="team">${nflLogo(N, g.away, 52)}<div><b>${esc(A.nickname || g.away)}</b><small>${nflRecord(N, g.away, g.t)}</small></div></div>
        <div class="mid" id="mid">${midHtml()}</div>
        <div class="team home">${nflLogo(N, g.home, 52)}<div><b>${esc(H.nickname || g.home)}</b><small>${nflRecord(N, g.home, g.t)}</small></div></div>
      </div>
      ${!g.final && g.state !== 'in' && g.home_implied != null ? `<div class="implied" title="Implied points from the spread and total"><span><b>${g.away_implied.toFixed(1)}</b></span><span class="muted">Team totals</span><span><b>${g.home_implied.toFixed(1)}</b></span></div>` : ''}
    </section>
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>`;

  const TABS = [['odds', 'Odds'], ['insights', 'Insights'], ['matchup', 'Matchup']];
  function renderTabs() {
    const tabs = g.state !== 'pre' ? [...TABS, ['box', 'Box score']] : TABS;
    if (st.tab === 'box' && g.state === 'pre') st.tab = 'odds';
    document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === st.tab ? 'on' : ''}">${l}</button>`).join('');
  }

  // ---------------------------------------------------------------- game lines + breakdown
  const MKTS = [['ml', 'Money line'], ['spread', 'Spread'], ['over', 'Over'], ['under', 'Under']];
  function betLabel(kind, team) {
    const L = nflLines(g, team);
    if (kind === 'ml') return `${team} money line${L.ml != null ? ` (${odds(L.ml)})` : ''}`;
    if (kind === 'spread') return `${team} ${signed(L.spread)}`;
    return `${kind === 'over' ? 'Over' : 'Under'} ${g.total}`;
  }
  function resultCell(s, kind, num) {
    const r = lineResults([s], kind, num)[0];
    const mark = r === 'hit' ? '<b class="hit">✓</b>' : r === 'miss' ? '<b class="miss">✗</b>' : '<b class="push">–</b>';
    if (kind === 'ml') return mark;
    if (kind === 'spread') return `${mark} <small>${signed(s.margin)}</small>`;
    return `${mark} <small>${s.total}</small>`;
  }
  function linesPane() {
    const available = MKTS.filter(([k]) => k === 'ml' ? g.home_ml != null || g.away_ml != null : k === 'spread' ? g.home_spread != null : g.total != null);
    if (!available.length) return `<div class="card">${nflGameLines(N, g)}</div>`;
    if (!available.some(([k]) => k === st.m)) st.m = available[0][0];
    const w = nflWindows(N, g, st.team, st.m);
    const rows = st.win === 'h2h' ? w.rows.filter(s => s.opp === (st.team === g.home ? g.away : g.home))
      : st.win === 'l5' ? w.rows.slice(-5) : st.win === 'season' ? w.rows : w.rows.slice(-10);
    const win = (k, label, t) => `<button data-win="${k}" class="${k === st.win ? 'on' : ''}"><small>${label}</small><b class="${t.n ? (t.rate >= 0.6 ? 'hit' : t.rate <= 0.4 ? 'miss' : '') : ''}">${t.n ? pct(t.rate) : '-'}</b><small>${t.n ? `${t.hits}/${t.n}` : ''}</small></button>`;
    const teamBtn = team => {
      const t = nflWindows(N, g, team, st.m).l10;
      return `<button data-team="${team}" class="${team === st.team ? 'on' : ''}">${nflLogo(N, team, 26)}<span><b>${esc(nflTeamName(N, team))}</b><small>${t.n ? `L${t.n} ${pct(t.rate)}` : 'no games yet'}</small></span></button>`;
    };
    const list = rows.slice().reverse().map(s => `<tr><td class="l">${esc(shortDate(s.g.date))}</td><td class="l">${s.home ? 'vs' : '@'} ${nflLogo(N, s.opp, 18)} ${esc(s.opp)}</td>
      <td class="${s.win ? 'hit' : s.tie ? '' : 'miss'}">${s.win ? 'W' : s.tie ? 'T' : 'L'} ${s.pts}-${s.oppPts}</td><td>${resultCell(s, st.m, w.num)}</td></tr>`).join('');
    return `<div class="card flush">${nflGameLines(N, g)}</div>
      <div class="card" id="lines">
        <h2>Breakdown</h2>
        <div class="tabs">${available.map(([k, l]) => `<button data-m="${k}" class="${k === st.m ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="nflteams">${teamBtn(g.away)}${teamBtn(g.home)}</div>
        <p class="note" style="margin:8px 0">${esc(betLabel(st.m, st.team))}: how ${esc(nflTeamName(N, st.team))} would have done against this number in past games.</p>
        <div class="nflwins">${win('h2h', 'H2H', w.h2h)}${win('l5', 'L5', w.l5)}${win('l10', 'L10', w.l10)}${win('season', String(meta.season || 'Season'), w.season)}</div>
        ${rows.length ? `<div class="tablewrap"><table class="data"><tr><th class="l">Date</th><th class="l">Opponent</th><th>Result</th><th>${st.m === 'ml' ? 'Won' : st.m === 'spread' ? 'Covered' : st.m === 'over' ? 'Over' : 'Under'}</th></tr>${list}</table></div>`
          : '<p class="note">No games in this window yet.</p>'}
      </div>`;
  }

  // ---------------------------------------------------------------- player props
  // Compact rows ("Trevor Lawrence - Passing yards"); tap one for a ladder of lines with each line's L10 strip and
  // hit rate; the arrow opens the player page on that stat and line. With no props pulled for this game, the main
  // players get typical lines (labeled) so the research still works.
  const gprops = nflGameProps(N, g.id);
  // Stat chips, in the order people bet them. A stat shows when either team has a player it fits.
  const STAT_ORDER = ['pass_yds', 'rush_yds', 'rec_yds', 'rec', 'rush_rec_yds', 'pass_td', 'cmp', 'att', 'car', 'int', 'pass_rush_yds', 'tgt', 'rush_td', 'rec_td'];
  const bookFor = stat => Object.entries(gprops).filter(([, by]) => by[stat]).map(([pid, by]) => ({ pid, r: by[stat] }));
  if (!st.stat) st.stat = STAT_ORDER.find(k => bookFor(k).length) || 'pass_yds';
  const OUT = /^IR|Out|Inactive|Released|Retired|Suspended/;
  let roster;
  function rosterPlayers() {
    if (roster) return roster;
    roster = [];
    const lastTwo = Object.fromEntries([g.away, g.home].map(t => [t, new Set(nflFinals(N, t, g.t).slice(-2).map(x => x.g.id))]));
    for (const team of [g.away, g.home]) {
      for (const [pid, p] of Object.entries(N.players)) {
        if (p.t !== team || OUT.test(p.st || '')) continue;
        const rows = nflPlayerRows(N, pid, g.t);
        // Played in one of the team's last two games (drops backups and players who've left the rotation).
        const recent = rows.filter(r => r.team === team && lastTwo[team].has(r.g.id));
        if (recent.length) roster.push({ pid, p, rows, team, recent });
      }
    }
    return roster;
  }
  // Players for one stat: everyone with a sportsbook line first, then (no line) the players the stat fits at their
  // position who've done it lately, with a typical line. Busiest first.
  function propItems(stat) {
    const book = new Map(bookFor(stat).map(x => [x.pid, x.r]));
    const f = NFL_STATS[stat].f;
    const items = [];
    for (const x of rosterPlayers()) {
      const r = book.get(x.pid);
      const fits = (NFL_POS_STATS[x.p.pos] || []).includes(stat) || (stat === 'pass_rush_yds' && x.p.pos === 'QB');
      const avg = x.rows.slice(-10).reduce((a, y) => a + f(y), 0) / Math.max(1, x.rows.slice(-10).length);
      const passer = ['pass_yds', 'cmp', 'att', 'pass_td', 'int', 'pass_rush_yds'].includes(stat);
      if (!r && passer && x.recent.reduce((a, y) => a + y.att, 0) / x.recent.length < 15) continue;   // the starter, not a mop-up QB
      if (!r && (!fits || avg < (NFL_STATS[stat].step >= 10 ? 10 : /_td$|^int$/.test(stat) ? 0.2 : 0.8))) continue;
      items.push({ ...x, stat, r: r || null, line: r ? r.line : nflTypical(x.rows, stat), avg });
    }
    for (const [pid, r] of book) if (!items.some(x => x.pid === pid)) items.push({ pid, p: N.players[pid] || { n: r.name, t: r.team, pos: r.pos }, rows: nflPlayerRows(N, pid, g.t), team: r.team, stat, r, line: r.line, avg: 0 });
    return items.sort((a, b) => (!!b.r - !!a.r) || b.avg - a.avg);
  }
  const pf = (x, line, price) => ({ sport: 'nfl', gid: g.id, pid: x.pid, name: (N.players[x.pid] || {}).n || (x.r && x.r.name), stat: x.stat, side: 'o', line,
    price: price ?? null, book: price != null && x.r ? x.r.book_o || null : null });
  let saved = savedKeys();
  function ladder(x) {
    saved = savedKeys();
    const rows = x.rows, f = NFL_STATS[x.stat].f;
    const was = x.r && x.r.was && x.r.was.line != null ? x.r.was.line : null;
    const lines = nflLadder(x.line, x.stat);
    if (was != null && !lines.includes(was)) { lines.push(was); lines.sort((a, b) => a - b); }
    return lines.map(line => {
      const res = rows.slice(-10).map(r => outcome(f(r), line, 'o')), t = tally(res);
      const main = line === x.line, price = main && x.r ? x.r.over : null;
      const wasTag = line === was && !main ? `<span class="price was" title="Priced before DraftKings moved the line">was ${x.r.was.over != null ? odds(x.r.was.over) : ''}</span>` : '';
      return `<div class="row nflrung${main ? ' main' : ''}"><b class="ln">O ${line}</b><div class="grow">${strip(res, rows.slice(-10).map(r => `Wk ${r.week} ${r.home ? 'vs' : '@'} ${r.opp}: ${f(r)}`))}</div>${rateTag(t)}
        ${price != null ? `<span class="price">${odds(price)}</span>` : wasTag}
        ${g.final ? '' : pickButton(pf(x, line, price), saved.has(pickKey(pf(x, line, price))))}
        <a class="gopill" href="nfl-player.html?id=${encodeURIComponent(x.pid)}&stat=${x.stat}&line=${line}&g=${encodeURIComponent(g.id)}" aria-label="Breakdown">›</a></div>`;
    }).join('');
  }
  function linePill(x) {
    if (!x.r) return `<span class="linepill typical" title="No sportsbook line: half a point above his last-10 average">O ${x.line} <small>typical</small></span>`;
    const move = x.r.open != null && x.r.open !== x.line ? ` <small class="${x.line > x.r.open ? 'up' : 'down'}">${x.line > x.r.open ? '↑' : '↓'}</small>` : '';
    return `<span class="linepill" title="${x.r.open != null && x.r.open !== x.line ? `Opened ${x.r.open}` : ''}">O ${x.line}${move} <small>${x.r.over != null ? odds(x.r.over) : 'DK'}</small></span>`;
  }
  function propsPane() {
    const avail = STAT_ORDER.filter(k => bookFor(k).length || rosterPlayers().some(x => (NFL_POS_STATS[x.p.pos] || []).includes(k)));
    if (!avail.includes(st.stat)) st.stat = avail[0] || 'pass_yds';
    const chips = `<div class="tabs nflstats">${avail.map(k => `<button data-stat="${k}" class="${k === st.stat ? 'on' : ''}">${esc(NFL_STATS[k].label)}</button>`).join('')}</div>`;
    const search = `<input class="search" id="psearch" type="search" placeholder="Search players…" value="${esc(st.term)}" style="margin-bottom:12px">`;
    const term = st.term.trim().toLowerCase();
    const items = propItems(st.stat).filter(x => !term || `${x.p.n} ${x.team}`.toLowerCase().includes(term));
    const anyBook = bookFor(st.stat).length;
    const pulled = N.propsPulled[g.id];
    const note = anyBook ? '' : `<p class="note" style="margin:-4px 0 10px">No sportsbook ${esc(NFL_STATS[st.stat].label.toLowerCase())} lines for this game yet, so each player gets a <b>typical line</b> (half a point above his last-10 average), not a real line.</p>`;
    if (!items.length) return chips + search + note + `<div class="card empty">No players found.</div>`;
    return chips + search + note + `<div class="card flush">${items.map(x => {
      const p = x.p, key = `${x.pid}|${x.stat}`, open = st.open === key;
      const inj = p.st ? ` <span class="tag nflst ${/^IR|Out/.test(p.st) ? 'out' : 'q'}">${esc(p.st)}</span>` : '';
      const href = `nfl-player.html?id=${encodeURIComponent(x.pid)}&stat=${x.stat}&g=${encodeURIComponent(g.id)}`;
      return `<div class="proprow compact${open ? ' open' : ''}">
        <div class="head" data-open="${esc(key)}"><a class="plink" href="${href}" aria-label="${esc(p.n)}">${p.img ? `<img class="nflmug" src="${esc(p.img)}" alt="" width="40" height="40" loading="lazy" onerror="this.remove()">` : '<span class="nflmug"></span>'}</a>
          <div class="grow"><a class="name" href="${href}">${esc(p.n)}</a>${inj}
            <div class="sub">${esc(x.team)} · ${esc(NFL_STATS[x.stat].label)}</div>${nflWasText(x.r) ? `<div class="sub wasline">DraftKings moved it · ${esc(nflWasText(x.r))}</div>` : ''}</div>
          ${liveTag(nflLiveValue(N, g.id, x.pid, x.stat), x.line)}${linePill(x)}<span class="chev">⌄</span></div>
        ${open ? `<div class="nflladder">${ladder(x)}</div>` : ''}</div>`;
    }).join('')}</div>
    <p class="note">${anyBook ? `DraftKings lines${pulled ? ` (updated ${esc(new Date(pulled).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))})` : ''}; prices where Mingus Picks pulled them, ↑↓ = moved since it opened. ` : ''}Tap a player for a ladder of lines with his last 10 games at each; › opens the full breakdown.</p>`;
  }
  function oddsPane() {
    const head = `<div class="tabs under"><button data-sub="lines" class="${st.sub === 'lines' ? 'on' : ''}">Game lines</button><button data-sub="props" class="${st.sub === 'props' ? 'on' : ''}">Player props</button></div>`;
    return head + (st.sub === 'props' ? propsPane() : linesPane());
  }

  // ---------------------------------------------------------------- insights
  let insights;
  function insightsPane() {
    insights = insights || nflGameInsights(N, g);
    const sorts = { best: (a, b) => b.strength - a.strength, rate: (a, b) => b.rate - a.rate || b.n - a.n };
    const list = insights.filter(x => st.ikind === 'all' || x.type === st.ikind).sort(sorts[st.isort]);
    const controls = `<div class="row" style="margin-bottom:12px;flex-wrap:wrap">
      <div class="seg">${[['all', 'All'], ['player', 'Players'], ['team', 'Teams']].map(([k, l]) => `<button data-ikind="${k}" class="${k === st.ikind ? 'on' : ''}">${l}</button>`).join('')}</div>
      <span class="grow"></span>
      <div class="seg">${[['best', 'Best'], ['rate', 'Hit rate']].map(([k, l]) => `<button data-isort="${k}" class="${k === st.isort ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
    const note = insights.some(x => x.typical) ? `<p class="note" style="margin:-4px 0 10px">No sportsbook props for this game yet, so player trends use typical lines (half a point above the last-10 average).</p>` : '';
    return controls + note + (list.length ? `<div class="insights">${list.map(x => nflInsightCard(N, x)).join('')}</div>`
      : `<div class="card empty">No strong trends for this game: nothing hits 75% or more over 5+ games.</div>`);
  }

  // ---------------------------------------------------------------- matchup
  const R = nflRanks(N);
  const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const fmtStat = (k, v) => v == null ? '-' : k === 'ypp' ? v.toFixed(1) : k === 'to' || k === 'sk' ? v.toFixed(1) : v.toFixed(1);
  function rankCell(rank) {
    if (!rank) return '<td>-</td>';
    const cls = rank <= 8 ? 'hit' : rank > R.of - 8 ? 'miss' : '';
    return `<td class="${cls}">${ord(rank)}</td>`;
  }
  function matchupPane() {
    const off = st.off, def = off === g.home ? g.away : g.home;
    const O = R.totals[off] || { off: {} }, D = R.totals[def] || { def: {} };
    const ro = (R.ranks[off] || { off: {} }).off, rd = (R.ranks[def] || { def: {} }).def;
    const rows = NFL_RANK_STATS.map(([k, label]) => `<tr><td>${fmtStat(k, O.off[k])}</td>${rankCell(ro[k])}<td class="c"><b>${label}</b></td>${rankCell(rd[k])}<td>${fmtStat(k, D.def[k])}</td></tr>`).join('');
    const common = nflCommonOpponents(N, g.away, g.home, g.t);
    const res = s => `<span class="${s.win ? 'hit' : s.tie ? '' : 'miss'}">${s.win ? 'W' : s.tie ? 'T' : 'L'} ${s.pts}-${s.oppPts}</span>`;
    const rec = list => { const w = list.filter(s => s.win).length, t = list.filter(s => s.tie).length; return `${w}-${list.length - w - t}${t ? `-${t}` : ''}`; };
    const commonA = common.flatMap(c => c.a), commonH = common.flatMap(c => c.b);
    const last = team => nflFinals(N, team, g.t).slice(-5).reverse().map(s => `<tr><td class="l">Wk ${s.g.week}</td><td class="l">${s.home ? 'vs' : '@'} ${nflLogo(N, s.opp, 18)} ${esc(s.opp)}</td><td>${res(s)}</td>
      <td>${s.spread == null ? '-' : `${outcome(s.margin + s.spread, 0, 'o') === 'hit' ? '<b class="hit">✓</b>' : outcome(s.margin + s.spread, 0, 'o') === 'push' ? '–' : '<b class="miss">✗</b>'} <small>${signed(s.spread)}</small>`}</td>
      <td>${s.totalLine == null ? '-' : `${s.total > s.totalLine ? 'O' : s.total < s.totalLine ? 'U' : 'P'} <small>${s.totalLine}</small>`}</td></tr>`).join('');
    return `<div class="card">
        <h2>Team rankings (${esc(String(meta.season || ''))})</h2>
        <div class="row nflswap"><span class="grow">${nflLogo(N, off, 22)} <b>${esc(nflTeamName(N, off))} offense</b></span>
          <button class="btn" data-swap="1" aria-label="Swap offense and defense">⇄</button>
          <span class="grow" style="text-align:right"><b>${esc(nflTeamName(N, def))} defense</b> ${nflLogo(N, def, 22)}</span></div>
        <div class="tablewrap"><table class="data nflrank"><tr><th>Avg</th><th>Rank</th><th class="c">Per game</th><th>Rank</th><th>Avg</th></tr>${rows}</table></div>
        <p class="note">Ranks among ${R.of} teams this season. Offense: 1st = best (fewest turnovers and sacks taken). Defense: 1st = allows the least (forces the most turnovers and sacks). Green = top 8, red = bottom 8.</p>
      </div>
      <div class="card"><h2>Record vs common opponents</h2>
        ${common.length ? `<div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${esc(g.away)} ${rec(commonA)}</b><b>${rec(commonH)} ${esc(g.home)}</b></div>
          <div class="tablewrap"><table class="data">${common.map(c => `<tr><td class="l">${c.a.map(res).join('<br>')}</td><td class="c">${nflLogo(N, c.opp, 22)}<br><small>${esc(c.opp)}</small></td><td>${c.b.map(res).join('<br>')}</td></tr>`).join('')}</table></div>`
          : '<p class="note">No common opponents yet this season.</p>'}</div>
      <div class="grid2">
        ${[g.away, g.home].map(team => `<div class="card"><h3>${nflLogo(N, team, 22)} ${esc(nflTeamName(N, team))}: last 5</h3>
          <div class="tablewrap"><table class="data"><tr><th class="l">Week</th><th class="l">Opp</th><th>Result</th><th>ATS</th><th>O/U</th></tr>${last(team) || '<tr><td colspan="5">No games yet.</td></tr>'}</table></div>
          <p class="note">ATS and O/U use each game's own line.</p></div>`).join('')}
      </div>`;
  }

  // ---------------------------------------------------------------- box score
  // Passing, rushing and receiving for each team, plus team stats once the data job saves the game. A stat with a
  // sportsbook line that day is green / red for cleared / missed (mid-game only the ones already past it).
  const BOX_SECTIONS = [
    ['Passing', r => r.att > 0, r => r.pass_yds, [['C/ATT', r => `${r.cmp}/${r.att}`, ['cmp', 'att']], ['YDS', r => r.pass_yds, 'pass_yds'], ['TD', r => r.pass_td, 'pass_td'], ['INT', r => r.int, 'int']]],
    ['Rushing', r => r.car > 0, r => r.rush_yds, [['CAR', r => r.car, 'car'], ['YDS', r => r.rush_yds, 'rush_yds'], ['TD', r => r.rush_td, 'rush_td']]],
    ['Receiving', r => r.rec > 0 || r.tgt > 0, r => r.rec_yds, [['REC', r => r.rec, 'rec'], ['TGT', r => r.tgt, 'tgt'], ['YDS', r => r.rec_yds, 'rec_yds'], ['TD', r => r.rec_td, 'rec_td']]],
  ];
  function boxCell(x, val, stat) {
    const line = x.pid && typeof stat === 'string' && (gprops[x.pid] || {})[stat] ? gprops[x.pid][stat].line : null;
    if (line == null) return `<td>${val}</td>`;
    const o = outcome(x.r[stat], line, 'o');
    const cls = o === 'push' || (g.state === 'in' && o === 'miss') ? '' : o;
    return `<td class="${cls}" title="Line ${line}">${val}</td>`;
  }
  function teamStatsCard() {
    const key = `${g.season}-${g.week}`, a = (N.box[g.away] || {})[key], h = (N.box[g.home] || {})[key];
    if (!a || !h) return '';
    const frac = v => Array.isArray(v) ? `${v[0]}/${v[1]}` : '-';
    const rows = [['Total yards', t => t.yds ?? (t.pass_yds + t.rush_yds)], ['Passing yards', t => t.pass_yds], ['Rushing yards', t => t.rush_yds],
      ['First downs', t => t.fd], ['3rd down', t => frac(t.third)], ['Red zone', t => frac(t.rz)], ['Turnovers', t => (t.int || 0) + (t.fl || 0)], ['Sacks taken', t => t.sk]];
    return `<div class="card"><h3>Team stats</h3><div class="tablewrap"><table class="data"><tr><th class="l"></th><th>${esc(g.away)}</th><th>${esc(g.home)}</th></tr>
      ${rows.map(([label, f]) => `<tr><td class="l">${label}</td><td>${f(a) ?? '-'}</td><td>${f(h) ?? '-'}</td></tr>`).join('')}</table></div></div>`;
  }
  function boxPane() {
    const B = nflBoxScore(N, g);
    if (!B.teams[g.away].length && !B.teams[g.home].length) {
      return `<div class="card empty">${g.state === 'in' ? 'Live box score loading…' : 'No box score yet.'}<br><small>It appears after the next data update.</small></div>`;
    }
    const name = x => x.pid ? `<a href="nfl-player.html?id=${encodeURIComponent(x.pid)}">${esc(x.n)}</a>` : esc(x.n);
    const table = team => `<div class="card"><div class="row" style="margin-bottom:8px">${nflLogo(N, team, 24)}<h3>${esc(nflTeamName(N, team))}</h3></div>
      ${BOX_SECTIONS.map(([title, keep, sortBy, cols]) => {
        const list = B.teams[team].filter(x => keep(x.r)).sort((p, q) => sortBy(q.r) - sortBy(p.r));
        if (!list.length) return '';
        return `<div class="tablewrap" style="margin-bottom:10px"><table class="data sticky"><tr><th class="l">${title}</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>
          ${list.map(x => `<tr><td class="l">${name(x)}${x.pos ? ` <small>${esc(x.pos)}</small>` : ''}</td>${cols.map(([, f, stat]) => boxCell(x, f(x.r), stat)).join('')}</tr>`).join('')}</table></div>`;
      }).join('')}</div>`;
    const note = B.live ? (g.state === 'in' ? "Live box score from ESPN. Green stat = already past today's prop line." : 'From ESPN; the full box score lands with the next data update.')
      : "Green / red stat = cleared / missed that day's prop line, when one was pulled.";
    return `${teamStatsCard()}${table(g.away)}${table(g.home)}<p class="note">${note}</p>`;
  }

  function render() {
    renderTabs();
    document.getElementById('pane').innerHTML = st.tab === 'box' ? boxPane() : st.tab === 'matchup' ? matchupPane() : st.tab === 'insights' ? insightsPane() : oddsPane();
    const ps = document.getElementById('psearch');
    if (ps) ps.addEventListener('input', () => {
      st.term = ps.value;
      const at = ps.selectionStart;
      render();
      const again = document.getElementById('psearch');
      again.focus();
      again.setSelectionRange(at, at);
    });
  }
  main.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const t = e.target.closest('[data-tab],[data-sub],[data-stat],[data-ikind],[data-isort],[data-m],[data-team],[data-win],[data-swap],[data-open]');
    if (!t) return;
    const d = t.dataset;
    if (d.open) { st.open = st.open === d.open ? null : d.open; render(); return; }
    if (d.tab) { st.tab = d.tab; history.replaceState(null, '', `${location.search}#${d.tab === 'odds' ? st.sub : d.tab}`); }
    else if (d.sub) { st.sub = d.sub; history.replaceState(null, '', `${location.search}#${d.sub}`); }
    else if (d.stat) { st.stat = d.stat; st.open = null; }
    else if (d.ikind) st.ikind = d.ikind;
    else if (d.isort) st.isort = d.isort;
    else if (d.m) st.m = d.m;
    else if (d.team) st.team = d.team;
    else if (d.win) st.win = d.win;
    else if (d.swap) st.off = st.off === g.home ? g.away : g.home;
    render();
  });
  bindPickButtons(main);
  render();
  // Live: header score every 25 s while the game is on, and "Now 54 / 64.5" on prop rows from the live box score.
  nflStartLive(N, { games: [g], gids: [g.id], onUpdate() {
    document.getElementById('mid').innerHTML = midHtml();
    if (st.tab === 'box' || (st.tab === 'odds' && st.sub === 'props')) render();
  } });
  // Just finished, before the data job saves the box score: fetch ESPN's once so the tab isn't empty.
  const B0 = nflBoxScore(N, g);
  if (g.final && g.eid && !B0.teams[g.away].length && !B0.teams[g.home].length) {
    fetch(`${NFL_LIVE_API}/summary?event=${g.eid}`).then(r => (r.ok ? r.json() : null)).then(sum => {
      if (!sum) return;
      N.liveBox = N.liveBox || {};
      N.liveBox[g.id] = Object.assign(nflParseLiveBox(sum), { final: true });
      if (st.tab === 'box') render();
    }).catch(() => {});
  }
  if (location.hash === '#lines') setTimeout(() => { const el = document.getElementById('lines'); if (el) el.scrollIntoView({ block: 'start' }); }, 50);
}).catch(err => {
  main.innerHTML = emptyState('NFL data is unavailable right now.', 'It comes from ESPN on each data update. Try again in a bit.');
  console.error(err);
});
</script>
</body>
</html>
