<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoop Lab · Props</title>
<meta name="description" content="Today's NBA player props ranked by how often each line has hit lately.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="pagehead"><h1>Props</h1><p>Today's sportsbook lines, ranked by how often they've hit lately.</p></section>
  <input class="search" id="q" type="search" placeholder="Search players or teams…" autocomplete="off" style="margin-bottom:10px">
  <div class="tabs" id="mkts"></div>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap">
    <div class="seg" id="side"></div><span class="grow"></span>
    <label class="row" style="gap:6px;font-size:13px;color:var(--muted)">Sort <select id="sort" style="width:auto">
      <option value="adj">L10, sample-adjusted</option><option value="l10">L10 hit rate</option><option value="l5">L5 hit rate</option><option value="l20">L20 hit rate</option>
      <option value="season">Season hit rate</option><option value="h2h">vs opponent</option><option value="time">Tip-off</option></select></label>
  </div>
  <p class="confnote">Big number = raw hit rate. <b>≈</b> = adjusted for sample size, so short streaks count less; <span class="amber">amber</span> = fewer than 10 games.</p>
  <div id="list"><div class="card skel-card"><div class="skel"></div><div class="skel" style="width:60%"></div></div></div>
</main>
<footer id="foot"></footer>
<script src="assets/common.js"></script>
<script>
shell('props');
lab(['players', 'logs', 'props', 'injuries']).then(L => {
  footer(L);
  const inj = injuryMap(L);
  const st = { mkt: 'all', side: 'best', sort: 'adj', q: '' };
  const games = L.props.games || {};

  // One entry per player prop, with hit rates for both sides from games before tip-off.
  const items = [];
  for (const [gid, props] of Object.entries(games)) {
    const g = L.byId.get(gid);
    if (!g) continue;
    for (const pr of props) {
      const p = L.players[pr.id];
      if (!p || !STATS[pr.s]) continue;
      const team = p.t, opp = team === g.h ? g.a : g.h;
      const rows = playerRows(L, pr.id).filter(r => r.g.t < g.t);
      const o = { opp, season: L.meta.season };
      items.push({ g, pr, p, opp, over: windowRates(rows, pr.s, pr.l, 'o', o), under: windowRates(rows, pr.s, pr.l, 'u', o) });
    }
  }

  const mkts = [...new Set(items.map(x => x.pr.s))];
  function controls() {
    document.getElementById('mkts').innerHTML = ['all', ...mkts].map(m => `<button data-mkt="${m}" class="${m === st.mkt ? 'on' : ''}">${m === 'all' ? 'All' : STATS[m].label}</button>`).join('');
    document.getElementById('side').innerHTML = [['best', 'Best side'], ['o', 'Overs'], ['u', 'Unders']].map(([k, l]) => `<button data-side="${k}" class="${k === st.side ? 'on' : ''}">${l}</button>`).join('');
  }

  function card(x, side) {
    const r = side === 'o' ? x.over : x.under, pr = x.pr;
    const price = side === 'o' ? pr.o : pr.u;
    const l10 = r.l10;
    const results = l10.rows.map(row => outcome(STATS[pr.s].f(row), pr.l, side));
    const href = `player.html?id=${pr.id}&stat=${pr.s}&line=${pr.l}&opp=${x.opp}${side === 'u' ? '&side=u' : ''}`;
    return `<a class="card flush" href="${href}" style="display:block">
      <div class="proprow"><div class="head" style="cursor:pointer">${headshot(pr.id, 42)}
        <div class="grow"><div class="name">${esc(x.p.n)} <small>(${esc(x.p.t)})</small>${injuryTag(inj.get(pr.id))}</div>
          <div class="sub">${side === 'o' ? 'Over' : 'Under'} ${pr.l} ${esc(STATS[pr.s].label)} · ${x.p.t === x.g.h ? 'vs' : '@'} ${esc(x.opp)} ${x.g.state === 'pre' ? fmtTime(x.g.t) : ''}</div></div>
        ${price != null ? `<span class="price">${odds(price)} <small>${bookName(pr.bk)}</small></span>` : ''}</div>
      <div style="padding:0 14px">${strip(results)}</div>
      <div class="rates r5">${oppRankCell(L, x.opp, x.p.p, pr.s)}${['l5', 'l10', 'l20', 'season'].map(k => `<div><small>${k === 'season' ? 'SEASON' : k.toUpperCase()}</small>${rateTag(r[k], { adj: true })}</div>`).join('')}</div></div></a>`;
  }

  function render() {
    controls();
    const list = document.getElementById('list');
    if (!items.length) {
      const o = L.meta.odds || {};
      list.innerHTML = `<div class="card empty">No sportsbook props pulled for today yet.<br><small>Lines are pulled once a day after 10 AM ET${o.remaining != null ? ` (${o.remaining} free API credits left this month)` : ''}. Meanwhile, every player page works with a typical line: <a href="players.html" style="color:var(--accent)">search players</a>.</small></div>`;
      return;
    }
    const q = st.q;
    const rows = items.filter(x => (st.mkt === 'all' || x.pr.s === st.mkt) &&
      (!q || `${x.p.n} ${x.p.t} ${x.opp}`.toLowerCase().includes(q))).map(x => {
      const side = st.side !== 'best' ? st.side : ((x.under.l10.rate || 0) > (x.over.l10.rate || 0) ? 'u' : 'o');
      return { x, side, r: side === 'o' ? x.over : x.under };
    });
    const key = st.sort;
    const out = y => String((inj.get(y.x.pr.id) || {}).st || '').toLowerCase().startsWith('out') ? 1 : 0;
    // Ruled-out players sink to the bottom; then by the chosen window, ties broken by L20.
    rows.sort((a, b) => (out(a) - out(b)) || (key === 'time' ? (a.x.g.t < b.x.g.t ? -1 : 1)
      : key === 'adj' ? ((b.r.l10.adj ?? -1) - (a.r.l10.adj ?? -1)) || ((b.r.l20.adj ?? -1) - (a.r.l20.adj ?? -1))
      : ((b.r[key].rate ?? -1) - (a.r[key].rate ?? -1)) || ((b.r.l20.rate ?? -1) - (a.r.l20.rate ?? -1))));
    list.innerHTML = rows.length ? rows.slice(0, 150).map(y => card(y.x, y.side)).join('')
      : `<div class="card empty">No props match.</div>`;
  }

  document.querySelector('main').addEventListener('click', e => {
    const t = e.target.closest('[data-mkt],[data-side]');
    if (!t) return;
    if (t.dataset.mkt) st.mkt = t.dataset.mkt;
    if (t.dataset.side) st.side = t.dataset.side;
    render();
  });
  document.getElementById('sort').addEventListener('change', e => { st.sort = e.target.value; render(); });
  document.getElementById('q').addEventListener('input', e => { st.q = e.target.value.trim().toLowerCase(); render(); });
  render();
}).catch(fail);
</script>
</body>
</html>
