<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Lab · Props</title>
<meta name="description" content="This week's NFL player props with hit rates by window, sortable and filterable.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mingus Lab">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/nfl.css">
</head>
<body>
<header id="top"></header>
<main>
  <section class="pagehead"><h1>NFL Props</h1><p id="sub">&nbsp;</p></section>
  <div class="tabs" id="filters"></div>
  <div id="list"></div>
</main>
<footer id="foot"></footer>
<div class="nflsort" id="sort"></div>
<script src="assets/common.js"></script>
<script src="assets/nfl.js"></script>
<script>
shell('nfl-props', 'nfl');
document.getElementById('list').innerHTML = skeleton(4, 3);
load('nfl/meta', 'nfl/games', 'nfl/teams', 'nfl/teamstats', 'nfl/players', 'nfl/logs', 'nfl/props', 'nfl/proj')
  .then(([meta, games, teams, teamstats, players, logs, props, proj]) => {
  const N = nflAddPlayers(nflLab(meta, games, teams, teamstats), players, logs, props, proj);
  document.getElementById('foot').innerHTML = `<p>Props: the sportsbooks Mingus Football pulls (night games and the Sunday slates). Hit rates describe the past, not the future. 21+ · Gamble responsibly · 1-800-GAMBLER.</p>`;
  const saved = (() => { try { return JSON.parse(localStorage.getItem('hooplab.nflprops')) || {}; } catch (e) { return {}; } })();
  const st = { sort: saved.sort || 'l10', side: saved.side || 'o', stat: saved.stat || 'all' };
  const SORTS = [['l5', 'L5'], ['l10', 'L10'], ['l20', 'L20'], ['h2h', 'H2H'], ['season', String(meta.season)], ['last', String(meta.season - 1)]];

  // Props for games that haven't been played yet; if none (between pulls), the most recent week's props.
  let gids = Object.keys(N.props).filter(id => { const g = N.byId.get(id); return g && !g.final; });
  let past = false;
  if (!gids.length) {
    const ids = Object.keys(N.props).filter(id => N.byId.get(id));
    const last = Math.max(0, ...ids.map(id => N.byId.get(id).week));
    gids = ids.filter(id => N.byId.get(id).week === last && N.byId.get(id).season === meta.season);
    past = true;
  }
  const items = [];
  for (const gid of gids) {
    const g = N.byId.get(gid);
    for (const r of N.props[gid]) {
      const p = N.players[r.pid];
      if (!p) continue;
      const team = r.team || p.t, opp = g.home === team ? g.away : g.home;
      const rows = nflPlayerRows(N, r.pid, g.t);
      items.push({ r, p, g, opp, rows, w: { o: nflPlayerWindows(rows, r.stat, r.line, 'o', opp, meta.season), u: nflPlayerWindows(rows, r.stat, r.line, 'u', opp, meta.season) } });
    }
  }
  const stats = [...new Set(items.map(x => x.r.stat))];

  function renderFilters() {
    document.getElementById('filters').innerHTML = [['all', 'All stats'], ...stats.map(s => [s, NFL_STATS[s].label])].map(([k, l]) => `<button data-stat="${k}" class="${k === st.stat ? 'on' : ''}">${esc(l)}</button>`).join('')
      + `<span class="grow"></span><div class="seg"><button data-side="o" class="${st.side === 'o' ? 'on' : ''}">Overs</button><button data-side="u" class="${st.side === 'u' ? 'on' : ''}">Unders</button></div>`;
    document.getElementById('sort').innerHTML = `<span>Sort</span>${SORTS.map(([k, l]) => `<button data-sort="${k}" class="${k === st.sort ? 'on' : ''}">${l}</button>`).join('')}`;
  }

  function card(x) {
    const w = x.w[st.side], t = w[st.sort], l10 = w.l10;
    const price = st.side === 'o' ? x.r.over : x.r.under, fair = st.side === 'o' ? x.r.fair_o : x.r.fair_u;
    const f = NFL_STATS[x.r.stat].f;
    const inj = x.p.st ? ` <span class="tag nflst ${/^IR|Out/.test(x.p.st) ? 'out' : 'q'}">${esc(x.p.st)}</span>` : '';
    return `<a class="card nflprop" href="nfl-player.html?id=${encodeURIComponent(x.r.pid)}&stat=${x.r.stat}&line=${x.r.line}${st.side === 'u' ? '&side=u' : ''}&g=${encodeURIComponent(x.g.id)}">
      <div class="row">${x.p.img ? `<img class="nflmug" src="${esc(x.p.img)}" alt="" width="40" height="40" loading="lazy" onerror="this.remove()">` : ''}
        <div class="grow"><b>${esc(x.p.n)}</b> <small class="muted">${esc(x.p.pos)} · ${esc(x.g.home === (x.r.team || x.p.t) ? 'vs' : '@')} ${esc(x.opp)}</small>${inj}
          <div class="sub"><b>${st.side === 'o' ? 'Over' : 'Under'} ${x.r.line}</b> ${esc(NFL_STATS[x.r.stat].label)}${price != null ? ` · <span class="price">${odds(price)}</span>` : ''}${fair != null ? ` <small class="muted">fair ${pct(fair)}</small>` : ''}</div></div>
        <div class="nflsortrate"><small>${esc(SORTS.find(s => s[0] === st.sort)[1])}</small>${rateTag(t, { count: true })}</div></div>
      ${strip(l10.rows.map(r => outcome(f(r), x.r.line, st.side)))}</a>`;
  }

  function renderList() {
    const list = items.filter(x => st.stat === 'all' || x.r.stat === st.stat)
      .sort((a, b) => ((b.w[st.side][st.sort].rate ?? -1) - (a.w[st.side][st.sort].rate ?? -1)) || (b.w[st.side][st.sort].n - a.w[st.side][st.sort].n));
    document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
      : emptyState('No props pulled yet this week.', 'Mingus Football pulls props for night games and the Sunday slates.');
    const g0 = gids.map(id => N.byId.get(id));
    document.getElementById('sub').textContent = [`Week ${g0.length ? g0[0].week : meta.week}`, `${list.length} props`, `${gids.length} game${gids.length === 1 ? '' : 's'}`, past ? 'last pull (games played)' : ''].filter(Boolean).join(' · ');
  }

  function save() { try { localStorage.setItem('hooplab.nflprops', JSON.stringify(st)); } catch (e) { /* private mode */ } }
  document.body.addEventListener('click', e => {
    const t = e.target.closest('[data-sort],[data-side],[data-stat]');
    if (!t) return;
    const d = t.dataset;
    if (d.sort) st.sort = d.sort; else if (d.side) st.side = d.side; else st.stat = d.stat;
    save(); renderFilters(); renderList();
  });
  renderFilters();
  renderList();
}).catch(err => {
  document.getElementById('list').innerHTML = emptyState('NFL data is unavailable right now.', 'Try again after the next data update.');
  console.error(err);
});
</script>
</body>
</html>
